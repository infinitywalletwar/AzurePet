# Local run of the app with the Aspire dashboard as OTLP endpoint
# (docs/labs/lab-01-walking-skeleton.md §6.6, ADR-0010 item 10).
#   docker compose up -d --build
#   App:        http://localhost:8080
#   Dashboard:  http://localhost:18888
# Both ports are bound to 127.0.0.1 only. The dashboard UI is anonymous, which is acceptable
# because it is loopback-only and holds synthetic local telemetry.

name: inpolsure

services:
  web:
    build:
      context: .
      dockerfile: src/InPolsure.Web/Dockerfile
    image: inpolsure-web:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
    depends_on:
      - aspire-dashboard

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.0@sha256:064b50d557fcaffd10f06bf79ba4069bd50994a84034f1a0fc35c165500482d7
    ports:
      # UI only; the OTLP endpoint (18889) stays on the compose network.
      - "127.0.0.1:18888:18888"
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
